<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AI-assisted resume analyzer. Get an estimated ATS-style score, skill-gap analysis and suggested bullet rewrites from your own resume text." />
    <meta name="color-scheme" content="dark light" id="color-scheme-meta" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ResumeIQ" />
    <meta property="og:title" content="ResumeIQ — AI-Powered Resume Analyzer & Job Fit Engine" />
    <meta property="og:description" content="AI-assisted resume analyzer. Get an estimated ATS-style score, skill-gap analysis and suggested bullet rewrites from your own resume text." />
    <meta property="og:url" content="%VITE_APP_URL%" />
    <meta property="og:image" content="%VITE_APP_URL%/og-preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ResumeIQ preview card showing ATS scoring and token extraction features" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ResumeIQ — AI-Powered Resume Analyzer & Job Fit Engine" />
    <meta name="twitter:description" content="AI-assisted resume analyzer. Get an estimated ATS-style score, skill-gap analysis and suggested bullet rewrites from your own resume text." />
    <meta name="twitter:image" content="%VITE_APP_URL%/og-preview.png" />
    <meta name="twitter:image:alt" content="ResumeIQ preview card showing ATS scoring and token extraction features" />

    <script>
      (function() {
        try {
          var stored = localStorage.getItem('theme');
          var isDark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
          var meta = document.getElementById('color-scheme-meta');
          if (meta) {
            meta.content = isDark ? 'dark' : 'light';
          }
        } catch (e) {}
      })();
    </script>
    <title>ResumeIQ</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

services:
  - type: web
    name: resumeiq-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: "npm install"
    startCommand: "npm start"
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_TIMEOUT_MS
        value: "45000"
      - key: GEMINI_TOTAL_TIMEOUT_MS
        value: "55000"
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
